name: Build TenviTest MP
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      CL: /source-charset:.932
    steps:
      - name: Checkout tenvi-mp (modified source)
        uses: actions/checkout@v4
        with:
          repository: ETboy-debug/tenvi-mp
          path: src
      - name: Gunzip sources (WAF bypass for .gz uploads)
        shell: bash
        run: |
          # 删除可能残留的明文源文件，避免旧版本干扰（gzip -df 默认不覆盖已存在文件）
          find src -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.vcxproj' -o -name '*.filters' \) -delete
          # 递归解压所有 .gz（gzip 自带于 Git for Windows）
          cnt=0
          while IFS= read -r f; do
            if gzip -df "$f"; then
              cnt=$((cnt+1))
            else
              echo "GUNZIP_FAIL $f"
            fi
          done < <(find src -type f -name '*.gz')
          echo "gunzip done, count=$cnt"
          # 验证 MPClient.h 解压结果
          if [ -f src/AutoResponse/MPClient.h ]; then
            echo "MPClient.h line81 = [$(sed -n '81p' src/AutoResponse/MPClient.h)]"
          else
            echo "WARN MPClient.h missing after gunzip"
          fi
      - name: Checkout Riremito/tools (Share libs)
        uses: actions/checkout@v4
        with:
          repository: Riremito/tools
          path: tools
      - name: Checkout Riremito/tv_xml (game data)
        uses: actions/checkout@v4
        with:
          repository: Riremito/tv_xml
          path: tv_xml
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Detect SDK and Toolset
        shell: pwsh
        run: |
          $incRoot = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdks = @(Get-ChildItem $incRoot -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^10\.' } | Sort-Object Name)
          Write-Host "Available SDKs: $($sdks.Name -join ', ')"
          if ($sdks.Count -eq 0) { throw "no windows sdk found" }
          $sdk = $sdks[-1].Name

          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -property installationPath
          $vcTargets = Join-Path $vsRoot "MSBuild\Microsoft\VC"
          $ptRoots = @(Get-ChildItem -Path $vcTargets -Recurse -Directory -Filter "PlatformToolsets" -ErrorAction SilentlyContinue)
          $tsAll = @()
          foreach ($r in $ptRoots) {
            if ($r.FullName -match '\\Win32\\' -and $r.FullName -notmatch 'Application Type') {
              $tsAll += @(Get-ChildItem $r.FullName -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
            }
          }
          $tsAll = @($tsAll | Where-Object { $_ -match '^v\d{3}$' } | Sort-Object -Unique)
          Write-Host "Win32 platform toolsets: $($tsAll -join ', ')"
          $ts = $null
          foreach ($c in @('v143','v142','v145','v144','v141','v140')) { if ($tsAll -contains $c) { $ts = $c; break } }
          if (-not $ts -and $tsAll.Count -gt 0) { $ts = $tsAll[-1] }
          if (-not $ts) { $ts = 'v143' }

          Write-Host "USING SDK=$sdk TOOLSET=$ts"
          "SDKVER=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TOOLSET=$ts" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Simple lib
        shell: cmd
        run: msbuild tools\Simple\Simple.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=%TOOLSET% /p:WindowsTargetPlatformVersion=%SDKVER% /p:SDLCheck=false /p:TreatWarningAsError=false /p:ConformanceMode=false /m
      - name: Build Hook lib
        shell: cmd
        run: msbuild tools\Hook\Hook.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=%TOOLSET% /p:WindowsTargetPlatformVersion=%SDKVER% /p:SDLCheck=false /p:TreatWarningAsError=false /p:ConformanceMode=false /m
      - name: Prepare Share libs into source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src\Share\Simple | Out-Null
          New-Item -ItemType Directory -Force src\Share\Hook | Out-Null
          # headers (shared between 32/64 projects)
          Copy-Item tools\Simple\Simple64\*.h src\Share\Simple\ -Force -ErrorAction SilentlyContinue
          Copy-Item tools\Hook\Hook64\*.h src\Share\Hook\ -Force -ErrorAction SilentlyContinue
          # whatever the build events already produced
          if (Test-Path tools\Simple\Share\Simple) { Copy-Item tools\Simple\Share\Simple\* src\Share\Simple\ -Force -Recurse }
          if (Test-Path tools\Hook\Share\Hook) { Copy-Item tools\Hook\Share\Hook\* src\Share\Hook\ -Force -Recurse }
          # 32-bit static libs
          $sl = Get-ChildItem tools\Simple -Recurse -Filter Simple.lib -ErrorAction SilentlyContinue | Select-Object -First 1
          $hl = Get-ChildItem tools\Hook -Recurse -Filter Hook.lib -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sl) { Copy-Item $sl.FullName src\Share\Simple\Simple.lib -Force } else { Write-Host "WARN: Simple.lib not found" }
          if ($hl) { Copy-Item $hl.FullName src\Share\Hook\Hook.lib -Force } else { Write-Host "WARN: Hook.lib not found" }
          Write-Host "--- src\Share\Simple ---"
          Get-ChildItem src\Share\Simple | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "--- src\Share\Hook ---"
          Get-ChildItem src\Share\Hook | Select-Object Name, Length | Format-Table -AutoSize
      - name: Build AutoResponse (client inject dll)
        continue-on-error: true
        shell: cmd
        run: msbuild src\AutoResponse\AutoResponse.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=%TOOLSET% /p:WindowsTargetPlatformVersion=%SDKVER% /p:SDLCheck=false /p:TreatWarningAsError=false /p:ConformanceMode=false /m
      - name: Capture AutoResponse build errors
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          TOK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $log = ""
          if (Test-Path autoresponse_build.log) { $log = Get-Content autoresponse_build.log -Raw }
          $errs = ($log -split "`n" | Where-Object { $_ -match 'error C|fatal error' }) -join "`n"
          if (-not $errs) { $errs = "NO_C_ERROR_FOUND`n" + ((($log -split "`n") | Select-Object -Last 50) -join "`n") }
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($errs))
          $api = "https://api.github.com/repos/ETboy-debug/tenvi-build/contents/build_err.txt"
          $hdr = @{ Authorization="Bearer $env:TOK"; Accept="application/vnd.github+json" }
          $sha = $null
          try { $r = Invoke-RestMethod -Uri ($api + "?ref=master") -Headers $hdr; if ($r.sha) { $sha = $r.sha } } catch {}
          $body = @{ message="build err dump"; content=$b64 }
          if ($sha) { $body.sha = $sha }
          Invoke-RestMethod -Uri $api -Method PUT -Headers $hdr -Body ($body | ConvertTo-Json) -ContentType application/json
      - name: Build EmuMainTenvi (bypass patches)
        shell: cmd
        run: msbuild src\EmuMainTenvi\EmuMainTenvi.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=%TOOLSET% /p:WindowsTargetPlatformVersion=%SDKVER% /p:SDLCheck=false /p:TreatWarningAsError=false /p:ConformanceMode=false /m
      - name: Build EmuLoaderTenvi (loader dll)
        shell: cmd
        run: msbuild src\EmuLoaderTenvi\EmuLoaderTenvi.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=%TOOLSET% /p:WindowsTargetPlatformVersion=%SDKVER% /p:SDLCheck=false /p:TreatWarningAsError=false /p:ConformanceMode=false /m
      - name: Build PacketTenvi (packet logger)
        shell: cmd
        continue-on-error: true
        run: msbuild src\PacketTenvi\PacketTenvi.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=%TOOLSET% /p:WindowsTargetPlatformVersion=%SDKVER% /p:SDLCheck=false /p:TreatWarningAsError=false /p:ConformanceMode=false /m
      - name: Build RunEmuTenvi (injector)
        shell: cmd
        run: msbuild src\RunEmuTenvi\RunEmuTenvi.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=%TOOLSET% /p:WindowsTargetPlatformVersion=%SDKVER% /p:SDLCheck=false /p:TreatWarningAsError=false /p:ConformanceMode=false /m
      - name: Build StandaloneServer
        shell: cmd
        run: msbuild src\StandaloneServer\StandaloneServer.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=%TOOLSET% /p:WindowsTargetPlatformVersion=%SDKVER% /p:SDLCheck=false /p:TreatWarningAsError=false /p:ConformanceMode=false /m
      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          foreach ($f in @('AutoResponse.dll','EmuMainTenvi.dll','EmuLoaderTenvi.dll','PacketTenvi.dll','RunEmuTenvi.exe','StandaloneServer.exe')) {
            $hit = Get-ChildItem -Path src -Recurse -Filter $f -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
            if ($hit) { Copy-Item $hit.FullName -Destination (Join-Path 'dist' $f) -Force } else { Write-Host "MISS: $f" }
          }
          if (Test-Path src\RunEmuTenvi.ini) { Copy-Item src\RunEmuTenvi.ini -Destination dist\RunEmuTenvi.ini -Force }
          if (Test-Path src\RunEmuTenvi_CN.ini) { Copy-Item src\RunEmuTenvi_CN.ini -Destination dist\RunEmuTenvi_CN.ini -Force }
          if (Test-Path tv_xml\CN) { New-Item -ItemType Directory dist\tv_xml -Force | Out-Null; Copy-Item -Recurse -Force tv_xml\CN dist\tv_xml\CN }
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath tenvi-mp.zip -Force
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mp-latest
          files: tenvi-mp.zip
          body: "TenviTest MP milestone1: client dll (real connect) + StandaloneServer.exe (port 8787). Start StandaloneServer.exe first, then inject the client."
